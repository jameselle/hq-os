<!doctype html><html lang="en"><meta charset="utf-8"><title>HQ Feed Collector</title><style>body{font:14px system-ui;background:#101728;color:#edf2ff;width:320px;padding:18px}h1{font-size:19px}p{line-height:1.5;color:#b9c4da}select,button{box-sizing:border-box;width:100%;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #40506a;background:#1d2940;color:white}button{cursor:pointer}#status{white-space:pre-wrap}</style><h1>HQ Feed Collector</h1><p>Create a session in HQ, then open Instagram Explore or TikTok For You. Your session connects automatically when you start.</p><label>HQ session<select id="session" aria-label="HQ session"></select></label><button id="refresh">Refresh sessions</button><button id="start">Start collecting this feed tab</button><button id="stop">Stop collection</button><p id="status" role="status"></p><p>Reads visible posts only. Scrolls until your time/post limit, or Stop. Pauses when the tab is hidden. No likes, follows, comments, cookies or messages.</p><script src="popup.js"></script></html>
